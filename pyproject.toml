[project]
name = "url-shortener-fastapi"
version = "0.1.0"
description = "A RESTful URL shortening service built with FastAPI, PostgreSQL, SQLAlchemy and Docker Compose."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]
